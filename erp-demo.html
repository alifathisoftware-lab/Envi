<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERPSchool - نسخة العرض التجريبي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Cairo',Arial,sans-serif;background:#f3f4f6;color:#111827;direction:rtl}
    .layout{display:flex;min-height:100vh}
    .side{position:fixed;top:0;right:0;bottom:0;width:250px;background:#fff;border-left:1px solid #e5e7eb;display:flex;flex-direction:column;z-index:50;transition:transform .3s}
    .brand{display:flex;align-items:center;gap:12px;padding:18px 16px;border-bottom:1px solid #f3f4f6}
    .brand-mark{width:38px;height:38px;border-radius:10px;background:#1d4ed8;color:#fff;display:grid;place-items:center;font-size:18px;flex-shrink:0}
    .brand strong{display:block;font-size:17px;color:#111827}
    .brand span{display:block;font-size:12px;color:#64748b}
    .nav{flex:1;padding:12px;overflow-y:auto;display:grid;gap:4px}
    .nav button{width:100%;border:none;border-radius:8px;padding:10px 14px;cursor:pointer;text-align:right;background:transparent;color:#475569;font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px;transition:all .15s}
    .nav button:hover{background:#f0f4ff;color:#1d4ed8}
    .nav button.active{background:#eaf1ff;color:#1d4ed8;font-weight:700}
    .nav button i{width:20px;text-align:center;font-size:15px}
    .side-foot{padding:14px 16px;border-top:1px solid #f3f4f6;font-size:11px;color:#94a3b8;text-align:center}
    .main{margin-right:250px;flex:1;min-height:100vh;display:flex;flex-direction:column}
    .top{height:72px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;gap:12px}
    .top h1{font-size:20px;color:#111827}
    .top p{font-size:13px;color:#64748b;margin-top:1px}
    .top-actions{display:flex;gap:8px}
    .screen{flex:1;padding:24px;display:grid;gap:16px;overflow-y:auto}
    button,input,select,textarea{font-family:inherit;font-size:inherit}
    .icon-btn{width:36px;height:36px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;display:inline-grid;place-items:center;color:#475569;transition:all .15s}
    .icon-btn:hover{background:#f3f4f6;color:#111827}
    .icon-btn.danger{color:#dc2626;border-color:#fecaca}
    .icon-btn.danger:hover{background:#fef2f2}
    .icon-btn.success{color:#16a34a;border-color:#bbf7d0}
    .icon-btn.success:hover{background:#f0fdf4}
    .btn{border:none;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .15s}
    .btn.primary{background:#1d4ed8;color:#fff}.btn.primary:hover{background:#1e40af}
    .btn.success{background:#16a34a;color:#fff}.btn.success:hover{background:#15803d}
    .btn.danger{background:#dc2626;color:#fff}.btn.danger:hover{background:#b91c1c}
    .search{display:flex;align-items:center;gap:8px;min-width:220px;border:1px solid #d1d5db;border-radius:8px;padding:0 12px;background:#fff}
    .search i{color:#94a3b8;font-size:14px}
    .search input{border:none;outline:none;padding:9px 0;flex:1;background:transparent;font-size:13px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    .stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;display:flex;align-items:center;gap:14px}
    .stat i{width:42px;height:42px;border-radius:10px;background:#eaf1ff;color:#1d4ed8;display:grid;place-items:center;font-size:18px}
    .stat div{display:flex;flex-direction:column}
    .stat span{font-size:12px;color:#64748b}
    .stat strong{font-size:20px;color:#111827;margin-top:2px}
    .panel{background:#fff;border:1px solid #e5e7eb;border-radius:10px;overflow:hidden}
    .panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid #f3f4f6;flex-wrap:wrap;gap:10px}
    .panel-head h2{font-size:16px;color:#111827}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse}
    th,td{padding:11px 14px;border-bottom:1px solid #f3f4f6;text-align:right;font-size:13px;white-space:nowrap}
    th{background:#f8fafc;color:#475569;font-weight:700;font-size:12px}
    tr:hover td{background:#fafbfc}
    tr:last-child td{border-bottom:0}
    .badge{display:inline-flex;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700}
    .badge.ok{background:#dcfce7;color:#166534}
    .badge.bad{background:#fee2e2;color:#991b1b}
    .badge.warn{background:#fef9c3;color:#854d0e}
    .badge.info{background:#e0e7ff;color:#3730a3}
    .badge.gray{background:#f1f5f9;color:#475569}
    .muted{color:#64748b;font-size:12px}
    .detail{display:grid;gap:16px}
    .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .kv div{display:flex;flex-direction:column;gap:2px}
    .kv span{font-size:12px;color:#64748b}
    .kv strong{font-size:14px;color:#111827}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(2px);z-index:100;display:none;place-items:center;padding:16px}
    .modal.show{display:grid}
    .modal-card{background:#fff;border-radius:12px;width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.15)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #f3f4f6}
    .modal-head h2{font-size:17px;color:#111827}
    .modal-body{padding:20px;overflow-y:auto;flex:1}
    .modal-actions{display:flex;gap:10px;justify-content:flex-start;padding:14px 20px;border-top:1px solid #f3f4f6}
    .form{display:grid;gap:14px}
    .field{display:flex;flex-direction:column;gap:5px}
    .field label{font-size:13px;font-weight:600;color:#374151}
    .field input,.field select,.field textarea{border:1px solid #d1d5db;border-radius:8px;padding:9px 12px;outline:none;transition:border-color .15s;font-size:14px}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.08)}
    .field textarea{resize:vertical;min-height:60px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .toast{position:fixed;left:20px;bottom:20px;background:#111827;color:#fff;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:500;z-index:200;display:none;box-shadow:0 8px 30px rgba(0,0,0,.2)}
    .toast.show{display:flex;align-items:center;gap:8px}
    .toast.error{background:#991b1b}
    .mobile-only{display:none}
    @media(max-width:780px){
      .side{position:fixed;transform:translateX(100%);width:260px}
      .side.open{transform:translateX(0);box-shadow:-10px 0 40px rgba(0,0,0,.1)}
      .mobile-only{display:inline-grid}
      .main{margin-right:0}
      .top{height:auto;padding:14px 16px;flex-wrap:wrap}
      .screen{padding:14px}
      .stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
      .row{grid-template-columns:1fr}
      .modal-card{max-width:100%}
      .panel-head{flex-direction:column;align-items:flex-start}
      .toolbar{width:100%}
      .search{min-width:0;flex:1}
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side" id="side">
      <div class="brand">
        <div class="brand-mark"><i class="fas fa-school"></i></div>
        <div>
          <strong>ERPSchool</strong>
          <span>إدارة المدرسة</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot">ERPSchool v1.0</div>
    </aside>

    <main class="main">
      <header class="top">
        <button class="icon-btn mobile-only" data-action="ui.toggleSide()" title="القائمة"><i class="fas fa-bars"></i></button>
        <div>
          <h1 id="page-title">لوحة التحكم</h1>
          <p id="page-subtitle">نظرة سريعة على المدرسة</p>
        </div>
        <div class="top-actions">
          <button class="icon-btn" data-action="app.refresh()" title="تحديث"><i class="fas fa-rotate"></i></button>
          <button class="icon-btn" data-action="window.print()" title="طباعة"><i class="fas fa-print"></i></button>
          <button class="icon-btn" data-action="actions.logout()" title="تسجيل الخروج" style="color:#ef4444"><i class="fas fa-right-from-bracket"></i></button>
        </div>
      </header>
      <section id="app" class="screen"></section>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <div id="modal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn" data-action="ui.closeModal()" title="إغلاق"><i class="fas fa-xmark"></i></button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

<script>
// =====================================================================
// 1. قاعدة البيانات الوهمية (Mock Database) - بديل الـ Backend
// =====================================================================
const mockDB = {
  me: { id: 1, username: "admin", fullName: "مدير النظام", role: { name: "ADMIN" } },
  roles: [{id: 1, name: "ADMIN"}, {id: 2, name: "REGISTRAR"}],
  students: [
    { id: 1, studentCode: "ST-1001", firstName: "محمد", lastName: "علي", fullName: "محمد علي حسن", nationalId: "1199012", birthDate: "2010-05-10", gender: "Male", phone: "0912345678", email: "m@test.com", address: "طرابلس", residence: "طرابلس", guardianName: "علي حسن", guardianPhone: "0912345678", totalFees: 1000, section: { id: 1, name: "شعبة أ", schoolClass: { id: 1, name: "الصف الأول" } }, academicYear: { id: 1, name: "2023-2024" }, status: true },
    { id: 2, studentCode: "ST-1002", firstName: "سارة", lastName: "أحمد", fullName: "سارة أحمد محمد", nationalId: "1201234", birthDate: "2011-02-15", gender: "Female", phone: "0987654321", email: "s@test.com", address: "بنغازي", residence: "بنغازي", guardianName: "أحمد محمد", guardianPhone: "0987654321", totalFees: 1000, section: { id: 2, name: "شعبة ب", schoolClass: { id: 1, name: "الصف الأول" } }, academicYear: { id: 1, name: "2023-2024" }, status: true }
  ],
  teachers: [
    { id: 1, teacherCode: "TC-2001", firstName: "خالد", lastName: "المبروك", fullName: "خالد المبروك", nationalId: "2019234", identityNumber: "2019234", phone: "0911111111", salary: 5000, address: "طرابلس", scheduleNotes: "", subjects: [{ id: 1, name: "رياضيات" }], specialization: "رياضيات" }
  ],
  years: [
    { id: 1, name: "2023-2024", startDate: "2023-09-01", endDate: "2024-06-01", currentYear: true, status: "OPEN" }
  ],
  classes: [
    { id: 1, name: "الصف الأول", description: "المرحلة الابتدائية" },
    { id: 2, name: "الصف الثاني", description: "المرحلة الابتدائية" }
  ],
  sections: [
    { id: 1, name: "شعبة أ", schoolClass: { id: 1, name: "الصف الأول" } },
    { id: 2, name: "شعبة ب", schoolClass: { id: 1, name: "الصف الأول" } },
    { id: 3, name: "شعبة أ", schoolClass: { id: 2, name: "الصف الثاني" } }
  ],
  subjects: [
    { id: 1, name: "رياضيات", code: "MATH", creditHours: 4, description: "رياضيات عامة" },
    { id: 2, name: "علوم", code: "SCI", creditHours: 3, description: "علوم عامة" }
  ],
  fees: [
    { id: 1, schoolClass: { id: 1, name: "الصف الأول" }, academicYear: { id: 1, name: "2023-2024" }, amount: 1000, type: "رسوم دراسية", status: "UNPAID", notes: "" }
  ],
  installments: [
    { id: 1, student: { id: 1, fullName: "محمد علي حسن" }, title: "القسط الأول", amount: 1000, paidAmount: 500, remainingAmount: 500, dueDate: "2023-10-01", status: "PARTIAL", notes: "" }
  ],
  payments: [
    { id: 1, student: { id: 1, fullName: "محمد علي حسن" }, installment: { id: 1, title: "القسط الأول" }, amount: 500, paymentDate: "2023-10-05", paymentMethod: "نقدي", receiptNumber: "R-1001", notes: "دفعة أولى" }
  ],
  exams: [
    { id: 1, name: "اختبار الفصل الأول", type: "FIRST_TERM", academicYear: { id: 1, name: "2023-2024" } }
  ],
  grades: [
    { id: 1, student: { id: 1, fullName: "محمد علي حسن" }, subject: { id: 1, name: "رياضيات" }, exam: { id: 1, name: "اختبار الفصل الأول" }, score: 85, examType: "اختبار الفصل الأول" }
  ],
  attendance: [
    { id: 1, student: { id: 1, fullName: "محمد علي حسن", section: { id: 1, schoolClass: { id: 1, name: "الصف الأول" }, name: "شعبة أ" } }, date: "2023-10-15", status: "PRESENT", notes: "" }
  ],
  users: [
    { id: 1, username: "admin", fullName: "مدير النظام", role: { id: 1, name: "ADMIN" }, enabled: true }
  ],
  classSubjects: [
    { id: 1, schoolClass: { id: 1, name: "الصف الأول" }, subject: { id: 1, name: "رياضيات" }, teacher: { id: 1, fullName: "خالد المبروك" } }
  ]
};

// خريطة المسارات لتبسيط الطلبات الوهمية
const pathMap = {
  '/students': 'students',
  '/teachers': 'teachers',
  '/academic-years': 'years',
  '/classes': 'classes',
  '/sections': 'sections',
  '/subjects': 'subjects',
  '/fees': 'fees',
  '/installments': 'installments',
  '/payments': 'payments',
  '/exams': 'exams',
  '/grades': 'grades',
  '/attendance': 'attendance',
  '/users': 'users',
  '/class-subjects': 'classSubjects'
};

// =====================================================================
// 2. كائن API الوهمي (Mock API) - يعترض الطلبات ويرد بالبيانات
// =====================================================================
const api = {
  get(path) {
    return new Promise(resolve => {
      setTimeout(() => {
        if (path === "/users/me") return resolve(mockDB.me);
        const key = pathMap[path];
        resolve(mockDB[key] ? JSON.parse(JSON.stringify(mockDB[key])) : []);
      }, 200); // محاكاة تأخير الشبكة
    });
  },
  post(path, body) {
    return new Promise(resolve => {
      setTimeout(() => {
        const key = pathMap[path];
        if (!mockDB[key]) mockDB[key] = [];
        const newItem = { ...JSON.parse(JSON.stringify(body)), id: Math.floor(Math.random() * 10000) + 100 };
        
        // ربط العلاقات (Relations) للبيانات الجديدة لعرضها بشكل صحيح
        if (key === 'students' && newItem.section) {
          newItem.section = mockDB.sections.find(s => s.id === newItem.section.id) || newItem.section;
          newItem.academicYear = mockDB.years.find(y => y.id === newItem.academicYear?.id) || newItem.academicYear;
        }
        if (key === 'payments' && newItem.studentId) {
           newItem.student = mockDB.students.find(s => s.id === newItem.studentId);
           if (newItem.installmentId) {
             newItem.installment = mockDB.installments.find(i => i.id === newItem.installmentId);
           }
        }
        if (key === 'installments' && newItem.student) {
           const st = mockDB.students.find(s => s.id === newItem.student.id);
           if (st) newItem.student = { id: st.id, fullName: st.fullName };
        }
        if (key === 'grades' && newItem.studentId) {
           newItem.student = mockDB.students.find(s => s.id === newItem.studentId);
           newItem.subject = mockDB.subjects.find(s => s.id === newItem.subjectId);
           newItem.exam = mockDB.exams.find(e => e.id === newItem.examId);
        }
        if (key === 'class-subjects' && newItem.schoolClass) {
           newItem.schoolClass = mockDB.classes.find(c => c.id === newItem.schoolClass.id);
           newItem.subject = mockDB.subjects.find(s => s.id === newItem.subject.id);
           if (newItem.teacher) newItem.teacher = mockDB.teachers.find(t => t.id === newItem.teacher.id);
        }
        if (key === 'fees' && newItem.schoolClass) {
           newItem.schoolClass = mockDB.classes.find(c => c.id === newItem.schoolClass.id);
           newItem.academicYear = mockDB.years.find(y => y.id === newItem.academicYear.id);
        }
        if (key === 'attendance' && newItem.studentId) {
           const st = mockDB.students.find(s => s.id === newItem.studentId);
           if (st) newItem.student = { id: st.id, fullName: st.fullName, section: st.section };
        }
        if (key === 'exams' && newItem.academicYear) {
           newItem.academicYear = mockDB.years.find(y => y.id === newItem.academicYear.id);
        }
        
        mockDB[key].push(newItem);
        resolve(newItem);
      }, 200);
    });
  },
  put(path, body) {
     return new Promise(resolve => {
       setTimeout(() => {
         const parts = path.split('/');
         const key = pathMap['/' + parts[1]];
         const id = Number(parts[2]);
         if (mockDB[key]) {
           const index = mockDB[key].findIndex(x => x.id === id);
           if (index !== -1) {
             let updated = { ...mockDB[key][index], ...body };
             if (key === 'students') {
               if (body.section) updated.section = mockDB.sections.find(s => s.id === body.section.id) || body.section;
               if (body.academicYear) updated.academicYear = mockDB.years.find(y => y.id === body.academicYear.id) || body.academicYear;
             }
             mockDB[key][index] = updated;
             resolve(updated);
             return;
           }
         }
         resolve(body);
       }, 200);
     });
  },
  del(path) {
     return new Promise(resolve => {
       setTimeout(() => {
         const parts = path.split('/');
         const key = pathMap['/' + parts[1]];
         const id = Number(parts[2]);
         if (mockDB[key]) {
           mockDB[key] = mockDB[key].filter(x => x.id !== id);
         }
         resolve(null);
       }, 200);
     });
  }
};

// =====================================================================
// 3. كود النظام الأصلي (JavaScript) مع تعديلات بسيطة ليتوافق مع العرض
// =====================================================================
const state = {
  page: "dashboard",
  selectedStudentId: null,
  query: "",
  currentUser: null,
  data: {
    students: [], teachers: [], years: [], classes: [], sections: [], subjects: [],
    fees: [], installments: [], payments: [], exams: [], grades: [], attendance: [],
    users: [], classSubjects: []
  }
};

const pages = [
  ["dashboard", "لوحة التحكم", "نظرة مالية وإدارية", "fa-chart-line"],
  ["students", "الطلاب", "إضافة ومتابعة الطلاب", "fa-user-graduate"],
  ["fees", "الرسوم", "رسوم الصفوف والسنوات", "fa-file-invoice-dollar"],
  ["installments", "الأقساط", "جدولة الأقساط والتحصيل", "fa-receipt"],
  ["teachers", "المعلمون", "بيانات المعلمين والمواد", "fa-chalkboard-user"],
  ["subjects", "المواد", "إدارة المواد الدراسية", "fa-book"],
  ["classes", "الصفوف والشعب", "تنظيم الهيكل الدراسي", "fa-school"],
  ["academicYears", "السنوات", "إدارة السنوات الدراسية", "fa-calendar-alt"],
  ["attendance", "الحضور", "تسجيل ومتابعة الحضور", "fa-clipboard-list"],
  ["grades", "الدرجات", "إدخال ومراجعة النتائج", "fa-clipboard-check"],
  ["promotion", "نقل الطلاب", "نقل الناجحين إلى الصف القادم", "fa-arrow-up-right-dots"],
  ["reports", "التقارير", "تصدير وطباعة", "fa-file-export"],
  ["users", "المستخدمون", "إدارة المستخدمين والصلاحيات", "fa-users-cog"]
];

const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
const money = (v) => `${Number(v || 0).toLocaleString("ar-LY")} د.ل`;
const today = () => new Date().toISOString().slice(0, 10);
const byId = (items, id) => items.find((x) => String(x.id) === String(id));
const nameOf = (x) => x ? (x.fullName || `${x.firstName || ""} ${x.lastName || ""}`.trim() || x.name || "بدون اسم") : "غير محدد";
const splitName = (full) => {
  const parts = full.trim().split(/\s+/).filter(Boolean);
  return { firstName: parts.slice(0, Math.max(1, parts.length - 1)).join(" "), lastName: parts.slice(-1).join(" ") };
};
const studentClass = (s) => s?.section?.schoolClass?.name || "";
const studentSection = (s) => s?.section?.name || "";
const studentClassId = (s) => s?.section?.schoolClass?.id || "";
const studentYearId = (s) => s?.academicYear?.id || "";
const isAdmin = () => String(state.currentUser?.role?.name || "").toUpperCase() === "ADMIN";

function icon(iconName, action, title, type = "") {

function panel(title, tools, content) {

function table(headers, rows, emptyText = "لا توجد بيانات") {

  return `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function reportTable(headers, rows, emptyText = "لا توجد بيانات") {

  const body = rows || `<tr><td colspan="${headers.length}" style="text-align:center;padding:24px">${emptyText}</td></tr>`;

}

function stat(label, value, iconName) {
  return `<div class="stat"><i class="fas ${iconName}"></i><div><span>${label}</span><strong>${value}</strong></div></div>`;
}

function feeForClass(classId, yearId) {
  let fee = state.data.fees.find((f) => String(f.schoolClass?.id) === String(classId) && String(f.academicYear?.id) === String(yearId));
  if (!fee) fee = state.data.fees.find((f) => String(f.schoolClass?.id) === String(classId));
  return Number(fee?.amount || 0);
}
function studentFinance(studentId) {
  const installments   = state.data.installments.filter((i) => String(i.student?.id) === String(studentId));
  const linkedPaid     = installments.reduce((sum, i) => sum + Number(i.paidAmount || 0), 0);
  const generalPaid    = state.data.payments
    .filter((p) => String(p.student?.id) === String(studentId) && !p.installment)
    .reduce((sum, p) => sum + Number(p.amount || 0), 0);
  const totalInstallments = installments.reduce((sum, i) => sum + Number(i.amount || 0), 0);
  const student = byId(state.data.students, studentId);
  const total =
    totalInstallments > 0
      ? totalInstallments
      : Number(student?.totalFees) > 0
      ? Number(student.totalFees)
      : feeForClass(studentClassId(student), studentYearId(student));
  const paid = linkedPaid + generalPaid;
  return { total, paid, due: Math.max(total - paid, 0), installments };
}
function statusBadge(status) {
  const map = {
    PAID:    ["ok",   "مدفوع"],
    PARTIAL: ["warn", "جزئي"],
    OVERDUE: ["bad",  "متأخر"],
    UNPAID:  ["gray", "غير مدفوع"],
    PRESENT: ["ok",   "حاضر"],
    ABSENT:  ["bad",  "غائب"],
    LATE:    ["warn", "متأخر"],
    EXCUSED: ["info", "معذر"]
  };
  const item = map[status] || map.UNPAID;
  return `<span class="badge ${item[0]}">${item[1]}</span>`;
}
function gradeLabel(score) {
  const v = Number(score || 0);
  if (v >= 85) return "ممتاز";
  if (v >= 75) return "جيد جداً";
  if (v >= 65) return "جيد";
  if (v >= 50) return "مقبول";
  return "ضعيف";
}
function studentAverage(studentId) {
  const grades = state.data.grades.filter((g) => String(g.student?.id) === String(studentId));
  if (!grades.length) return null;
  return grades.reduce((sum, g) => sum + Number(g.score || 0), 0) / grades.length;
}

const app = {
  async init() {
    renderNav();
    await app.refresh();
  },
  async refresh() {
    try {
      $("app").innerHTML = `<div class="muted" style="padding:40px;text-align:center">جاري تحميل البيانات...</div>`;
      const [me, students, teachers, years, classes, sections, subjects, fees, installments, payments, exams, grades, attendance, classSubjects] =
        await Promise.all([
          api.get("/users/me").catch(() => null),
          api.get("/students"),
          api.get("/teachers"),
          api.get("/academic-years"),
          api.get("/classes"),
          api.get("/sections"),
          api.get("/subjects"),
          api.get("/fees"),
          api.get("/installments"),
          api.get("/payments"),
          api.get("/exams").catch(() => []),
          api.get("/grades").catch(() => []),
          api.get("/attendance").catch(() => []),
          api.get("/class-subjects").catch(() => [])
        ]);
      state.currentUser = me;
      const users = isAdmin() ? await api.get("/users").catch(() => []) : [];
      state.data = { students, teachers, years, classes, sections, subjects, fees, installments, payments, exams, grades, attendance, users, classSubjects };
      if (state.page === "users" && !isAdmin()) state.page = "dashboard";
      render();
    } catch (e) {
      $("app").innerHTML = `<div class="panel" style="padding:24px;color:#b91c1c">${esc(e.message)}</div>`;
      ui.toast(e.message, "error");
    }
  },
  go(page, id) {
    state.page = page;
    state.selectedStudentId = id || null;
    state.query = "";
    renderNav();
    render();
    $("side").classList.remove("open");
  },
  search(value) { state.query = value; render(); },
  searchFromBox() { state.query = $("search_input")?.value || ""; render(); },
  clearSearch() { state.query = ""; render(); }
};

function renderNav() {
  $("nav").innerHTML = pages
    .filter(([id]) => id !== "users" || isAdmin())
    .map(([id, label, , iconName]) =>
      `<button type="button" class="${state.page === id ? "active" : ""}" data-action="app.go('${id}')"><i class="fas ${iconName}"></i>${label}</button>`
    ).join("");
}

function render() {
  const page = pages.find((p) => p[0] === state.page) || pages[0];
  $("page-title").textContent = page[1];
  $("page-subtitle").textContent = page[2];
  const views = {
    dashboard: viewDashboard, students: viewStudents, student: viewStudent, fees: viewFees,
    installments: viewInstallments, teachers: viewTeachers, subjects: viewSubjects, classes: viewClasses,
    academicYears: viewAcademicYears, attendance: viewAttendance, grades: viewGrades, reports: viewReports,
    promotion: viewPromotion, users: viewUsers
  };
  $("app").innerHTML = (views[state.page] || viewDashboard)();
}

function viewDashboard() {
  const finance  = state.data.students.map((s) => studentFinance(s.id));
  const total    = finance.reduce((a, f) => a + f.total, 0);
  const paid     = finance.reduce((a, f) => a + f.paid, 0);
  const due      = Math.max(total - paid, 0);
  const overdue  = state.data.installments.filter(
    (i) => Number(i.remainingAmount ?? (i.amount - i.paidAmount)) > 0 && i.dueDate < today()
  ).length;
  const latestPayments = state.data.payments.slice().sort((a, b) => b.id - a.id).slice(0, 6).map(
      (p) => `<tr><td>${esc(nameOf(p.student))}</td><td>${esc(p.installment?.title || "دفعة عامة")}</td><td>${money(p.amount)}</td><td>${esc(p.paymentDate || "")}</td></tr>`
    );
  return `<div class="grid stats">
    ${stat("الطلاب", state.data.students.length, "fa-user-graduate")}
    ${stat("المعلمون", state.data.teachers.length, "fa-chalkboard-user")}
    ${stat("الصفوف والشعب", `${state.data.classes.length} / ${state.data.sections.length}`, "fa-school")}
    ${stat("إجمالي الرسوم", money(total), "fa-file-invoice-dollar")}
    ${stat("المدفوع", money(paid), "fa-money-bill-wave")}
    ${stat("المتبقي", money(due), "fa-triangle-exclamation")}
    ${stat("أقساط متأخرة", overdue, "fa-clock")}
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px">
    ${panel("آخر الدفعات", button("عرض الدفعات", "fa-arrow-left", "app.go('installments')"), table(["الطالب", "القسط", "المبلغ", "التاريخ"], latestPayments, "لا توجد دفعات"))}
    ${panel("تنبيهات", "", `<div style="padding:15px;display:grid;gap:10px">
      <span class="badge ${due > 0 ? "bad" : "ok"}">المتبقي: ${money(due)}</span>
      <span class="badge ${overdue > 0 ? "warn" : "ok"}">الأقساط المتأخرة: ${overdue}</span>
      <span class="badge info">تأكد من ضبط رسوم كل صف قبل إضافة الطلاب</span>
    </div>`)}
  </div>`;
}

    .filter((g) => !selectedClassId || String(studentClassId(g.student)) === String(selectedClassId))

  const examRows = state.data.exams.map((e) => `<tr><td>${esc(e.name)}</td><td>${esc(e.type)}</td><td>${esc(e.academicYear?.name || "")}</td></tr>`);

          <div class="field"><label>إلى الصف</label><select onchange="window.promotionTargetClass=this.value;window.promotionTargetSection='';render()">${selectOptions(state.data.classes, targetClassId)}</select></div>

const actions = {
  async wrap(fn) { try { await fn(); } catch (e) { ui.toast(e.message || "حدث خطأ غير متوقع", "error"); } },
  async remove(endpoint, id) {
    if (!confirm("هل أنت متأكد من الحذف؟ لا يمكن التراجع عن هذه العملية.")) return;
    await actions.wrap(async () => { await api.del(`/${endpoint}/${id}`); await app.refresh(); ui.toast("تم الحذف بنجاح"); });
  },
  logout() {
    if (!confirm("هل تريد تسجيل الخروج؟")) return;
    window.location.reload(); // إعادة تحميل الصفحة لمحاكاة الخروج
  },
  async saveStudent(id) {
    const full = $("st_full").value.trim();
    if (!full) return ui.toast("أدخل الاسم الرباعي", "error");
    if (!$("st_section").value) return ui.toast("اختر الشعبة", "error");
    if (!$("st_year").value) return ui.toast("اختر السنة الدراسية", "error");
    const parts = splitName(full);
    const body = {
      studentCode: id ? byId(state.data.students, id)?.studentCode : `ST-${Date.now()}`,
      firstName: parts.firstName, lastName: parts.lastName, fullName: full,
      nationalId: $("st_nid").value.trim(), birthDate: $("st_birth").value || null,
      gender: $("st_gender").value, phone: $("st_phone").value.trim(), email: $("st_email").value.trim(),
      address: $("st_home").value.trim(), residence: $("st_home").value.trim(),
      guardianName: $("st_guardian").value.trim(), guardianPhone: $("st_guardian_phone").value.trim(),
      totalFees: Number($("st_total").value || 0), section: { id: Number($("st_section").value) },
      academicYear: { id: Number($("st_year").value) }, status: true
    };
    await actions.wrap(async () => {
      const saved = id ? await api.put(`/students/${id}`, body) : await api.post("/students", body);
      if (!id && body.totalFees > 0) {
        await api.post("/installments", { student: { id: saved.id }, title: "القسط الأول", amount: body.totalFees, paidAmount: 0, dueDate: today(), status: "UNPAID", notes: "قسط افتتاحي" });
      }
      ui.closeModal(); await app.refresh(); ui.toast(id ? "تم تعديل بيانات الطالب" : "تم إضافة الطالب بنجاح");
    });
  },
  async saveFee(id) {
    if (!$("fee_class").value || !$("fee_year").value || Number($("fee_amount").value) <= 0) return ui.toast("أكمل الصف والسنة والقيمة", "error");
    const body = { schoolClass: { id: Number($("fee_class").value) }, academicYear: { id: Number($("fee_year").value) }, amount: Number($("fee_amount").value), type: $("fee_type").value.trim() || "رسوم دراسية", status: "UNPAID", notes: $("fee_notes").value.trim() };
    await actions.wrap(async () => { id ? await api.put(`/fees/${id}`, body) : await api.post("/fees", body); ui.closeModal(); await app.refresh(); ui.toast("تم حفظ الرسوم"); });
  },
  async saveInstallment(id) {
    const studentId = $("ins_student").value; const title = $("ins_title").value.trim(); const amount = Number($("ins_amount").value); const paid = Number($("ins_paid").value || 0); const dueDate = $("ins_due").value;
    if (!studentId) return ui.toast("اختر الطالب", "error");
    if (!title) return ui.toast("أدخل اسم القسط", "error");
    if (amount <= 0) return ui.toast("أدخل مبلغاً صحيحاً", "error");
    if (!dueDate) return ui.toast("أدخل تاريخ الاستحقاق", "error");
    const remaining = Math.max(amount - paid, 0); const status = paid <= 0 ? "UNPAID" : paid >= amount ? "PAID" : "PARTIAL";
    const body = { student: { id: Number(studentId) }, title, amount, paidAmount: paid, remainingAmount: remaining, dueDate, status, notes: $("ins_notes").value.trim() };
    await actions.wrap(async () => { id ? await api.put(`/installments/${id}`, body) : await api.post("/installments", body); ui.closeModal(); await app.refresh(); ui.toast("تم حفظ القسط"); });
  },
  async savePayment() {
    const studentId = $("pay_student").value; const installmentId = $("pay_installment").value; const amount = Number($("pay_amount").value); const date = $("pay_date").value;
    if (!studentId) return ui.toast("اختر الطالب", "error");
    if (amount <= 0) return ui.toast("أدخل مبلغاً صحيحاً", "error");
    if (!date) return ui.toast("أدخل تاريخ الدفع", "error");
    const body = { studentId: Number(studentId), installmentId: installmentId ? Number(installmentId) : null, amount, paymentDate: date, paymentMethod: $("pay_method").value, receiptNumber: $("pay_receipt").value.trim(), notes: $("pay_notes").value.trim() };
    await actions.wrap(async () => {
      const saved = await api.post("/payments", body);
      ui.closeModal(); await app.refresh(); ui.toast("تم تسجيل الدفعة بنجاح");
      actions.printReceipt(saved.id);
    });

    await actions.wrap(async () => { id ? await api.put(`/teachers/${id}`, body) : await api.post("/teachers", body); ui.closeModal(); await app.refresh(); ui.toast("تم حفظ بيانات المعلم"); });

  },
  async saveSubject(id) {
    const name = $("sb_name").value.trim();

  async saveAcademicYear(id) {

  async saveAttendance() {
    const studentId = $("at_student").value; const date = $("at_date").value; const status = $("at_status").value;
    if (!studentId) return ui.toast("اختر الطالب", "error");

    const body = { studentId: Number(studentId), date, status, notes: $("at_notes").value.trim() };
    await actions.wrap(async () => { await api.post("/attendance", body); ui.closeModal(); await app.refresh(); ui.toast("تم تسجيل الحضور"); });
  },
  async saveClassAttendance() {
    const classId = $("at_class").value; const date = $("at_bulk_date").value;
    const students = state.data.students.filter((s) => String(studentClassId(s)) === String(classId));
    if (!classId) return ui.toast("اختر الصف", "error");
    if (!date) return ui.toast("أدخل التاريخ", "error");
    if (!students.length) return ui.toast("لا يوجد طلاب في هذا الصف", "error");
    await actions.wrap(async () => {
      for (const student of students) {
        await api.post("/attendance", { studentId: Number(student.id), date, status: $(`at_status_${student.id}`).value, notes: $(`at_notes_${student.id}`).value.trim() });
      }
      ui.closeModal(); await app.refresh(); ui.toast("تم تسجيل حضور الصف");
    });

  async saveExam() {
    const name = $("ex_name").value.trim();
    if (!name) return ui.toast("أدخل اسم الاختبار", "error");
    const body = { name, type: $("ex_type").value, academicYear: { id: Number($("ex_year").value) } };
    await actions.wrap(async () => { await api.post("/exams", body); ui.closeModal(); await app.refresh(); ui.toast("تم إضافة الاختبار"); });

  async saveGrade() {
    const studentId = $("gr_student").value; const subjectId = $("gr_subject").value; const examId = $("gr_exam").value; const score = Number($("gr_score").value);
    if (!studentId || !subjectId || !examId) return ui.toast("أكمل جميع الحقول المطلوبة", "error");
    if (isNaN(score) || score < 0 || score > 100) return ui.toast("أدخل درجة صحيحة بين 0 و 100", "error");
    const body = { studentId: Number(studentId), subjectId: Number(subjectId), examId: Number(examId), examType: byId(state.data.exams, examId)?.name || "اختبار", score };
    await actions.wrap(async () => { await api.post("/grades", body); ui.closeModal(); await app.refresh(); ui.toast("تم حفظ الدرجة"); });
  },
  async saveUser(id) {
    const username = $("us_username").value.trim(); const password = $("us_password").value; const fullName = $("us_full").value.trim(); const roleId = $("us_role").value;
    if (!username) return ui.toast("أدخل اسم المستخدم", "error");
    if (!id && !password) return ui.toast("أدخل كلمة المرور", "error");
    if (!fullName) return ui.toast("أدخل الاسم الكامل", "error");
    const body = { username, fullName, enabled: $("us_enabled").value === "true", role: { id: Number(roleId) } };

    await actions.wrap(async () => { id ? await api.put(`/users/${id}`, body) : await api.post("/users", body); ui.closeModal(); await app.refresh(); ui.toast("تم حفظ المستخدم"); });
  },
  printReceipt(id) {
    const payment = byId(state.data.payments, id);
    if (!payment) return ui.toast("لم يتم العثور على الدفعة", "error");
    printDocument("إيصال قبض", receiptHtml(payment));
  },
  async backup() {
    await actions.wrap(async () => {
      const blob = new Blob([JSON.stringify(mockDB, null, 2)], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const stamp = new Date().toISOString().replace(/[:.]/g, "-").slice(0, 19);
      a.href = url; a.download = `erpschool-backup-${stamp}.txt`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      ui.toast("تم تنزيل النسخة الاحتياطية (عرض تجريبي)");
    });
  },
  exportCsv(type) {
    let csv = "";
    if (type === "students") {
      csv = "id,fullName,nationalId,class,section\n";
      mockDB.students.forEach(s => csv += `${s.id},${s.fullName},${s.nationalId || ""},${s.section?.schoolClass?.name || ""},${s.section?.name || ""}\n`);
    } else if (type === "teachers") {
      csv = "id,fullName,phone,salary\n";
      mockDB.teachers.forEach(t => csv += `${t.id},${t.fullName},${t.phone || ""},${t.salary || 0}\n`);
    } else if (type === "installments") {
      csv = "id,student,title,amount,status\n";
      mockDB.installments.forEach(i => csv += `${i.id},${i.student?.fullName || ""},${i.title},${i.amount},${i.status}\n`);
    } else if (type === "payments") {
      csv = "id,student,amount,date,method\n";
      mockDB.payments.forEach(p => csv += `${p.id},${p.student?.fullName || ""},${p.amount},${p.paymentDate},${p.paymentMethod}\n`);
    }
    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `report-${type}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
  },
  printReport(type) {
    const titles = { students: "تقرير الطلاب", teachers: "تقرير المعلمين", installments: "تقرير الأقساط", payments: "تقرير الدفعات" };
    const builders = {
      students: () => {
        const rows = state.data.students.map((s, index) => `<tr><td>${index + 1}</td><td>${esc(nameOf(s))}</td><td>${esc(s.nationalId || "")}</td><td>${esc(studentClass(s) || "")}</td><td>${esc(studentSection(s) || "")}</td><td>${esc(s.guardianName || "")}</td><td>${esc(s.guardianPhone || s.phone || "")}</td></tr>`).join("");
        return reportTable(["م", "الطالب", "الرقم الوطني", "الصف", "الشعبة", "ولي الأمر", "الهاتف"], rows);
      },
      teachers: () => {
        const rows = state.data.teachers.map((t, index) => `<tr><td>${index + 1}</td><td>${esc(nameOf(t))}</td><td>${esc(t.nationalId || "")}</td><td>${esc((t.subjects || []).map((s) => s.name).join("، ") || t.specialization || "")}</td><td>${esc(t.phone || "")}</td><td>${money(t.salary)}</td></tr>`).join("");
        return reportTable(["م", "المعلم", "الرقم الوطني", "المواد", "الهاتف", "الراتب"], rows);
      },
      installments: () => {
        const rows = state.data.installments.map((i, index) => `<tr><td>${index + 1}</td><td>${esc(nameOf(i.student))}</td><td>${esc(i.title || "")}</td><td>${money(i.amount)}</td><td>${money(i.paidAmount)}</td><td>${money(i.remainingAmount ?? Math.max((i.amount || 0) - (i.paidAmount || 0), 0))}</td><td>${esc(i.dueDate || "")}</td><td>${esc(i.status || "")}</td></tr>`).join("");
        return reportTable(["م", "الطالب", "القسط", "المبلغ", "المدفوع", "المتبقي", "الاستحقاق", "الحالة"], rows);
      },
      payments: () => {
        const rows = state.data.payments.map((p, index) => `<tr><td>${index + 1}</td><td>${esc(nameOf(p.student))}</td><td>${esc(p.installment?.title || "دفعة عامة")}</td><td>${money(p.amount)}</td><td>${esc(p.paymentDate || "")}</td><td>${esc(p.paymentMethod || "")}</td><td>${esc(p.receiptNumber || "")}</td></tr>`).join("");
        return reportTable(["م", "الطالب", "البند", "المبلغ", "التاريخ", "الطريقة", "الإيصال"], rows);
      }
    };
    const body = `<div class="paper"><div class="head"><div><h1>${titles[type] || "تقرير"}</h1><div class="muted">إدارة المدرسة</div></div><div class="muted">تاريخ الطباعة: ${today()}</div></div>${builders[type] ? builders[type]() : "<p>لا توجد بيانات</p>"}</div>`;
    printDocument(titles[type] || "تقرير", body);
  },
  printPromotionList() {
    const sourceClassId = window.promotionSourceClass || state.data.classes[0]?.id || "";
    const candidates = state.data.students.filter((s) => String(studentClassId(s)) === String(sourceClassId)).map((s) => ({ student: s, average: studentAverage(s.id) })).filter((x) => x.average !== null && x.average >= 50);
    const rows = candidates.map((x) => `<tr><td>${esc(nameOf(x.student))}</td><td>${esc(studentSection(x.student))}</td><td>${x.average.toFixed(1)}</td></tr>`).join("");
    printDocument("قائمة الطلاب الناجحين", `<div class="paper"><div class="head"><div><h1>قائمة الطلاب الناجحين</h1><div class="muted">ERPSchool</div></div><div class="muted">${today()}</div></div><table><thead><tr><th>الطالب</th><th>الشعبة</th><th>المتوسط</th></tr></thead><tbody>${rows || `<tr><td colspan="3">لا توجد بيانات</td></tr>`}</tbody></table></div>`);
  },
  async promotePassed() {
    const sourceClassId = window.promotionSourceClass || state.data.classes[0]?.id || "";
    const targetClassId = window.promotionTargetClass || "";
    const targetSections = state.data.sections.filter((s) => String(s.schoolClass?.id) === String(targetClassId));
    const targetSectionId = window.promotionTargetSection || targetSections[0]?.id || "";
    const targetYearId = window.promotionTargetYear || state.data.years.find((y) => y.currentYear)?.id || state.data.years[0]?.id || "";
    if (!sourceClassId || !targetClassId || !targetSectionId || !targetYearId) return ui.toast("اختر الصف والشعبة والسنة الجديدة", "error");
    const candidates = state.data.students.filter((s) => String(studentClassId(s)) === String(sourceClassId)).map((s) => ({ student: s, average: studentAverage(s.id) })).filter((x) => x.average !== null && x.average >= 50);
    if (!candidates.length) return ui.toast("لا يوجد طلاب ناجحون للنقل", "error");
    if (!confirm(`سيتم نقل ${candidates.length} طالب. هل تريد المتابعة؟`)) return;
    await actions.wrap(async () => {
      for (const item of candidates) {
        const s = item.student; const full = nameOf(s); const parts = splitName(full);
        await api.put(`/students/${s.id}`, {
          studentCode: s.studentCode, firstName: s.firstName || parts.firstName, lastName: s.lastName || parts.lastName, fullName: full,
          nationalId: s.nationalId, birthDate: s.birthDate || null, gender: s.gender || "Male", phone: s.phone || "", email: s.email || "",
          address: s.address || s.residence || "", residence: s.residence || s.address || "", guardianName: s.guardianName || "", guardianPhone: s.guardianPhone || "",
          totalFees: feeForClass(targetClassId, targetYearId) || s.totalFees || 0, section: { id: Number(targetSectionId) }, academicYear: { id: Number(targetYearId) }, status: true
        });
        for (const grade of state.data.grades.filter((g) => String(g.student?.id) === String(s.id))) {
          await api.del(`/grades/${grade.id}`);
        }
      }
      await app.refresh(); ui.toast("تم نقل الطلاب الناجحين");
    });
  }
};

window.app = app; window.ui = ui; window.forms = forms; window.actions = actions; window.render = render;

document.addEventListener("click", (event) => {
  const trigger = event.target.closest("[data-action]");
  if (!trigger) return;
  event.preventDefault();
  const action = trigger.getAttribute("data-action");
  try { Function(action).call(window); } catch (e) { console.error(e); ui.toast(e.message || "تعذر تنفيذ الأمر", "error"); }
});

document.addEventListener("DOMContentLoaded", app.init);
</script>
</body>
</html>
